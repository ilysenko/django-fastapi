name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            django: "5.2"
            django_spec: "Django~=5.2.0"
            fastapi_spec: "fastapi==0.115.0"
          - python: "3.11"
            django: "5.2"
            django_spec: "Django~=5.2.0"
            fastapi_spec: "fastapi>=0.115,<1"
          - python: "3.12"
            django: "5.2"
            django_spec: "Django~=5.2.0"
            fastapi_spec: "fastapi>=0.115,<1"
          - python: "3.12"
            django: "6.0"
            django_spec: "Django~=6.0.0"
            fastapi_spec: "fastapi>=0.115,<1"
          - python: "3.13"
            django: "6.1"
            django_spec: "Django~=6.1.0"
            fastapi_spec: "fastapi>=0.115,<1"
          - python: "3.14"
            django: "5.2"
            django_spec: "Django~=5.2.0"
            fastapi_spec: "fastapi>=0.115,<1"
          - python: "3.14"
            django: "6.1"
            django_spec: "Django~=6.1.0"
            fastapi_spec: "fastapi>=0.115,<1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the selected compatibility set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "${{ matrix.django_spec }}" "${{ matrix.fastapi_spec }}"
      - name: Run standalone tests and coverage
        run: pytest --cov=django_fastapi --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,lint]"
      - run: ruff check src tests examples scripts
      - run: ruff format --check src tests examples scripts
      - run: mypy

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[release]"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Install and import the built wheel
        run: |
          python -m venv /tmp/django-fastapi-wheel
          /tmp/django-fastapi-wheel/bin/pip install dist/*.whl
          /tmp/django-fastapi-wheel/bin/python -c "import django_fastapi; print(django_fastapi.__version__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Private project-pattern scan
        if: github.event_name == 'push'
        env:
          PRIVATE_LEAK_PATTERNS_B64: ${{ secrets.PRIVATE_LEAK_PATTERNS_B64 }}
        run: |
          test -n "$PRIVATE_LEAK_PATTERNS_B64"
          python scripts/check_public_tree.py . \
            --patterns-base64 "$PRIVATE_LEAK_PATTERNS_B64"
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-smoke:
    name: Compose smoke / ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [asgi-only, split-wsgi-asgi]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "httpx>=0.27,<1"
      - name: Start the example
        run: docker compose -f examples/${{ matrix.example }}/compose.yaml up --build --detach
      - name: Verify health and shared session authentication
        run: python scripts/smoke_example.py --timeout 120
      - name: Show container logs after a failure
        if: failure()
        run: docker compose -f examples/${{ matrix.example }}/compose.yaml logs --no-color
      - name: Stop the example
        if: always()
        run: docker compose -f examples/${{ matrix.example }}/compose.yaml down --volumes
