version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Runtime ranges express the oldest supported versions. Raising their lower
    # bounds automatically would silently drop compatibility. Keep security
    # updates enabled while disabling routine pip version-update pull requests.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/examples/asgi-only"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/examples/split-wsgi-asgi"
    schedule:
      interval: weekly
    ignore:
      # This is an intentionally fictional image used only in Kubernetes docs.
      - dependency-name: acme/books
