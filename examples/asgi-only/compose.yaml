services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: books
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d books"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - example-data:/var/lib/postgresql/data

  migrate:
    build:
      context: ../..
      dockerfile: examples/asgi-only/Dockerfile
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py seed_books
    environment: &app_environment
      DATABASE_HOST: database
      DATABASE_NAME: books
      DATABASE_USER: postgres
      DJANGO_SECRET_KEY: local-example-only-change-in-production
    depends_on:
      database:
        condition: service_healthy

  app:
    build:
      context: ../..
      dockerfile: examples/asgi-only/Dockerfile
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1-alpine
    depends_on:
      - app
    ports:
      - "${EXAMPLE_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  example-data:
